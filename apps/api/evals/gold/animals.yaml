# Gold set for Pink Floyd, Animals. Hand-checked against the reviewed seed in content/albums/animals
# and the research notes in docs/research/.
#
# keywords: a list of groups; the claim body must contain at least one word from EVERY group.
# Keep them generous (several spellings) but specific enough not to match unrelated claims.
#
# kind:
#   fact      a documented fact the finder should find
#   intent    something a band member said or meant; needs a PRIMARY source before approval, which
#             we do not have for any of these yet, so it must never be approvable on its own
#   conflict  sources disagree; the claim must carry both a supporting and a contradicting source
slug: animals

# A "primary" tier from any of these is wrong: they report what others said.
non_primary_domains:
  - wikipedia.org
  - songfacts.com
  - loudersound.com
  - americansongwriter.com
  - faroutmagazine.co.uk

items:
  # ---- album facts ----
  - { id: orwell, kind: fact, seed_claim: orwell-concept, keywords: [["animal farm", "orwell"]] }
  - { id: britannia-row, kind: fact, seed_claim: britannia-row, keywords: [["britannia row"], ["1976"]] }
  - { id: old-songs, kind: fact, seed_claim: old-songs, keywords: [["1974"], ["wish you were here"]] }
  - { id: no-wright-credit, kind: fact, seed_claim: no-wright-credit, keywords: [["wright"], ["writing credit"]] }
  - { id: cover-concept, kind: fact, seed_claim: cover-concept, keywords: [["battersea"], ["pig"], ["waters"]] }
  - { id: pig-escape, kind: fact, seed_claim: pig-escape, keywords: [["pig"], ["heathrow", "kent"], ["loose", "escape", "free"]] }
  - { id: charts, kind: fact, seed_claim: charts, keywords: [["number 2", "no. 2", "number two"], ["uk"]] }
  - { id: reception, kind: fact, seed_claim: reception, keywords: [["mixed"], ["review"]] }
  - { id: tour, kind: fact, seed_claim: in-the-flesh-tour, keywords: [["in the flesh"], ["dortmund"]] }
  - { id: montreal, kind: fact, seed_claim: montreal, keywords: [["montreal"], ["spat", "spit"]] }
  - { id: remix-2022, kind: fact, seed_claim: remix-2022, keywords: [["2022"], ["mix"]] }
  # ---- track facts ----
