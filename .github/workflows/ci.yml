name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: album
          POSTGRES_PASSWORD: album
          POSTGRES_DB: album
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U album" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://album:album@localhost:5432/album
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
      # Migrations and importer against real Postgres (tests use SQLite).
      - run: uv run alembic upgrade head
      - run: uv run python -m app.seed import placeholder-album
      - run: uv run python -m app.seed import placeholder-album
      - run: uv run python -m app.seed import animals

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  client:
    # The generated TypeScript client must match the API's OpenAPI schema.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && uv sync
      - run: pnpm gen:api
      - name: Fail if generated client is stale
        run: git diff --exit-code -- apps/web/openapi.json apps/web/src/api/schema.d.ts
